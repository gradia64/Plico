# Release: sui tag v*, i pacchetti costruiti dal tag e allegati alla release
# GitHub. Ripreso dal release.yml di OllaDesk, con due differenze:
#
# - il tag lo firma la sottochiave dei tag della chiave di rilascio di Plico
#   (packaging/plico-release-key.asc, impronte in scripts/release-keys.sh):
#   qui lo si VERIFICA con scripts/verify-tag.sh, e un tag non firmato o
#   firmato da un'altra chiave ferma tutto. Il PKGBUILD verificherà lo
#   stesso tag con validpgpkeys;
# - gli allegati non li firma una chiave nella CI: hanno SHA256SUMS e
#   un'attestazione di provenienza di GitHub, che lega ogni file a questo
#   workflow e al commit del tag. Si verifica con
#   gh attestation verify <file> -R gradia64/Plico
#   Così la CI non ha nessun segreto da custodire.
#
# Allegati: Plico-X.Y.Z-x86_64.AppImage, plico_X.Y.Z_amd64.deb (lo stesso
# albero dell'AppImage in /opt/plico), Plico-X.Y.Z-x86_64.flatpak,
# plico-X.Y.Z-1-any.pkg.tar.zst (Arch), SHA256SUMS. Il PKGBUILD va sull'AUR
# (scripts/publish-aur.sh) se c'è il secret AUR_SSH_PRIVATE_KEY.
#
# A mano (workflow_dispatch) costruisce e collauda gli stessi pacchetti dal
# ramo scelto, senza pubblicare niente: per provare il packaging prima di un tag.
# Su un ramo il pacchetto Arch resta fuori: il PKGBUILD clona il tag firmato
# v<versione>, che prima del rilascio non esiste. Lanciato su un tag lo
# costruisce, e nemmeno lì pubblica: publish parte solo dal push del tag.
# Con aur_tag (un tag già pubblicato, es. v0.1.4) fa invece solo l'AUR:
# verifica la firma di quel tag, costruisce e collauda il pacchetto Arch con il
# PKGBUILD.in del ramo e, dopo l'approvazione nell'environment release, pubblica
# il PKGBUILD su AUR. Serve per la prima pubblicazione di un tag uscito prima
# del job arch e per correggere il PKGBUILD senza un nuovo rilascio.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      aur_tag:
        description: "Solo AUR: tag già pubblicato da mettere su AUR (es. v0.1.4); vuoto = prova dei pacchetti"
        required: false
        default: ""

permissions:
  contents: read   # solo publish alza i permessi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # una release a metà non si interrompe

jobs:
  verify:
    name: Tag firmato e versione
    if: startsWith(github.ref, 'refs/tags/') || inputs.aur_tag != ''
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.aur_tag || github.ref_name }}
    steps:
      - name: Nome del tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag non valido: $TAG" >&2; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Tag annotato e firmato dalla sottochiave dei tag
        run: |
          # checkout può riscrivere il tag come leggero: si riprende l'oggetto
          # tag annotato com'è sul server prima di verificarne la firma
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          scripts/verify-tag.sh "$TAG"

      # gli stessi controlli di tools/flathub_manifest.py: versione in
      # pyproject.toml, in plico.__version__ e nell'ultima <release> della
      # metainfo, screenshot fissati al tag
      - name: Il tag corrisponde alla versione del codice
        run: |
          python3 - "$TAG" <<'PY'
          import re, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          import flathub_manifest as fm
          tag = sys.argv[1]
          metainfo = Path(fm.METAINFO).read_text()
          version = fm.check_versions(tag, Path("pyproject.toml").read_text(), metainfo)
          fm.check_screenshots(tag, metainfo)
          code = re.search(r'__version__ = "(.+)"', Path("src/plico/__init__.py").read_text())
          if not code or code.group(1) != version:
              sys.exit(f"src/plico/__init__.py dice {code and code.group(1)}, il tag {version}")
          print("versione", version, "ok")
          PY

      - name: Note di rilascio presenti
        run: scripts/release-notes.sh "$TAG" > /dev/null

  appimage:
    name: AppImage e .deb
    needs: verify
    # sui tag dopo verify; a mano senza (verify lì è saltato)
    if: >-
      !cancelled() && inputs.aur_tag == ''
      && (needs.verify.result == 'success'
          || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # SOURCE_DATE_EPOCH dall'ultimo commit

      # librerie di sistema che l'AppImage non include (GL, xkbcommon, D-Bus,
      # fontconfig), appstream per validare i metadati dell'AppDir, file per
      # appimagetool, xvfb per il collaudo su X11
      - name: Dipendenze di sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends appstream desktop-file-utils \
            file libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 xvfb \
            fonts-dejavu-core

      # download fissati per SHA-256 (scripts/build-appimage.sh e
      # packaging/appimage/requirements.txt)
      - name: AppImage
        run: scripts/build-appimage.sh

      # controlli con il Python dell'AppImage, l'intera suite di test con le
      # sue librerie, avvio offscreen e su X11
      - name: Collaudo dell'AppImage
        run: packaging/appimage/smoke-test.sh dist/Plico-*-x86_64.AppImage

      # lo stesso albero (build/appimage/AppDir), già provato con la suite,
      # in /opt/plico
      - name: Pacchetto .deb
        run: scripts/build-deb.sh

      # lintian, poi installazione, librerie, avvio e rimozione in Ubuntu
      # 22.04 e 24.04, Debian 12 e 13
      - name: Collaudo del .deb
        run: packaging/deb/smoke-test.sh dist/plico_*_amd64.deb

      - name: SHA-256
        run: sha256sum dist/*.AppImage dist/*.deb | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
          retention-days: 14

  flatpak:
    name: Flatpak
    needs: verify
    if: >-
      !cancelled() && inputs.aur_tag == ''
      && (needs.verify.result == 'success'
          || (github.event_name == 'workflow_dispatch' && needs.verify.result == 'skipped'))
    # la stessa build di ogni push su main: artefatto «plico-flatpak»
    uses: ./.github/workflows/flatpak.yml

  arch:
    name: Pacchetto Arch
    # solo dopo verify (sui tag o con aur_tag): il PKGBUILD clona da GitHub il
    # tag v<versione> firmato e ne verifica la firma (?signed + validpgpkeys),
    # come ogni utente AUR. Con aur_tag script e PKGBUILD.in sono quelli del
    # ramo, la versione quella del tag
    needs: verify
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5

      # poi check() (l'intera suite), namcap, installazione di prova e avvio
      - name: PKGBUILD e pacchetto Arch
        env:
          TAG: ${{ inputs.aur_tag || github.ref_name }}
        run: |
          PLICO_VERSION="${TAG#v}" scripts/prepare-aur.sh
          scripts/build-arch.sh

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          include-hidden-files: true   # .SRCINFO
          path: |
            dist/*.pkg.tar.zst
            build/aur/PKGBUILD
            build/aur/.SRCINFO
          retention-days: 14

  publish:
    name: Release su GitHub
    needs: [verify, appimage, flatpak, arch]
    # il push del tag (o il rilancio di quel run), non un dispatch su un tag:
    # quello è una prova, e non deve ricaricare la release né toccare l'AUR
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # come in OllaDesk: l'ultimo punto di controllo prima di pubblicare. Con
    # «Required reviewers» nelle impostazioni dell'environment, il job aspetta
    # l'approvazione del maintainer. La CI non firma niente (sopra); l'unico
    # secret è AUR_SSH_PRIVATE_KEY, per pubblicare il PKGBUILD sull'AUR.
    environment: release
    permissions:
      contents: write        # creare la release e caricare i file
      id-token: write        # attestazione di provenienza
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist/

      - uses: actions/download-artifact@v4
        with:
          name: plico-flatpak
          path: flatpak-bundle/

      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: arch/

      - name: Nomi e SHA256SUMS
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv flatpak-bundle/plico.flatpak "dist/Plico-${version}-x86_64.flatpak"
          cp arch/dist/*.pkg.tar.zst dist/
          mkdir -p build/aur
          cp arch/build/aur/PKGBUILD arch/build/aur/.SRCINFO build/aur/
          cd dist
          sha256sum Plico-* plico_*.deb plico-*.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Plico-*
            dist/plico_*.deb
            dist/plico-*.pkg.tar.zst

      - name: Allega alla release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          scripts/release-notes.sh "$tag" > "$RUNNER_TEMP/note.md"
          # una release già esistente (creata a mano, o un rilancio) resta
          # com'è: si caricano solo i file
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --verify-tag --title "Plico ${tag#v}" \
              --notes-file "$RUNNER_TEMP/note.md"
          fi

      - name: Pubblica su AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::secret AUR_SSH_PRIVATE_KEY assente: pubblicazione su AUR saltata"
            exit 0
          fi
          scripts/publish-aur.sh

  aur:
    name: Solo AUR (a mano)
    needs: [verify, arch]
    if: github.event_name == 'workflow_dispatch' && inputs.aur_tag != ''
    runs-on: ubuntu-24.04
    # come publish: aspetta l'approvazione del maintainer, e solo qui c'è il
    # secret dell'AUR
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: arch
          path: arch/

      - name: Pubblica su AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::error::secret AUR_SSH_PRIVATE_KEY assente nell'environment release"
            exit 1
          fi
          mkdir -p build/aur
          cp arch/build/aur/PKGBUILD arch/build/aur/.SRCINFO build/aur/
          scripts/publish-aur.sh
