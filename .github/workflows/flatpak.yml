name: Flatpak

# The real build: KDE runtime and SDK, PySide BaseApp, Tesseract compiled from
# source. Some tens of minutes, so not on every pull request: on main, and on
# request from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml builds the bundle it attaches to a release with this same job
  workflow_call:

# Read the code and nothing else: the cache and the uploaded artifact go
# through the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: io.github.gradia64.plico
  MANIFEST: flatpak/io.github.gradia64.plico.json
  # Outside the checkout: the plico module builds from the checkout itself,
  # and a build directory inside it would be copied into its own sources.
  WORK: /home/runner/flatpak-work

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Ubuntu 24.04 forbids unprivileged user namespaces through AppArmor,
      # and bubblewrap -- the sandbox flatpak-builder builds in -- needs them.
      - name: Allow the build sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Flatpak and the builder
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends flatpak dbus
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.flatpak.Builder
          # Installed here, from the manifest's own versions, rather than by
          # --install-deps-from: from inside the builder flatpak wants a D-Bus
          # session the runner does not have ("Cannot autolaunch D-Bus").
          version=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['runtime-version'])")
          base=$(python3 -c "import json; print(json.load(open('$MANIFEST'))['base-version'])")
          flatpak install --user -y --noninteractive flathub \
            "org.kde.Platform//$version" "org.kde.Sdk//$version" \
            "io.qt.PySide.BaseApp//$base"

      - name: Cache of the builder
        uses: actions/cache@v4
        with:
          path: /home/runner/flatpak-work/state
          key: flatpak-builder-${{ hashFiles('flatpak/*.json') }}
          restore-keys: flatpak-builder-

      - name: Lint the manifest
        # The linter Flathub runs on a submission. Not blocking until the
        # first release: the plico module still builds from the checkout
        # (type "dir"), which Flathub accepts only as a git source with a tag.
        continue-on-error: true
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest "$MANIFEST"

      - name: Build
        # No --sandbox: it refuses sources outside the manifest's directory,
        # and the plico module builds from the checkout ("path": ".."). Flathub
        # builds from a git tag instead, where the question does not arise.
        run: |
          dbus-run-session -- flatpak run org.flatpak.Builder --user --force-clean \
            --ccache --mirror-screenshots-url=https://dl.flathub.org/media \
            --state-dir="$WORK/state" --repo="$WORK/repo" \
            "$WORK/build" "$MANIFEST"

      - name: Lint the build
        # Known so far: the screenshot and icon mirroring errors, which concern Flathub's own media hosting and stay
        # even with --mirror-screenshots-url.
        continue-on-error: true
        run: |
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder repo "$WORK/repo"

      # --runtime-repo: installing the bundle fetches org.kde.Platform from
      # Flathub by itself, instead of failing on a missing runtime
      - name: Bundle
        run: |
          flatpak build-bundle --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            "$WORK/repo" plico.flatpak "$APP_ID"

      # The bundle that goes into a release, installed and started like a user
      # would: a plugin, a library or a permission missing from the sandbox
      # shows only here. Reaching the event loop is the test -- timeout (124)
      # means still running; the runtime is installed already.
      - name: Install and start the bundle
        run: |
          flatpak install --user -y --noninteractive --bundle plico.flatpak
          rc=0
          dbus-run-session -- timeout 20 flatpak run --env=QT_QPA_PLATFORM=offscreen \
            "$APP_ID" || rc=$?
          if [ "$rc" -ne 124 ]; then
            echo "plico exited at once (code $rc)" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: plico-flatpak
          path: plico.flatpak
          retention-days: 14
