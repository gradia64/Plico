<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Installed as /app/etc/fonts/local.conf, which the runtime's fonts.conf
  includes. Inside the sandbox the host's fonts are visible too, web fonts
  included (Debian's fonts-roboto-slab and fonts-font-awesome put .woff2 files
  in /usr/share/fonts/woff). When Qt needs a fallback for a glyph the UI
  font lacks, the password bullet U+25CF for one, fontconfig may pick one of
  them, and with the KDE 6.11 runtime that pick segfaults inside
  libfontconfig: the signature dialog closed the whole app as soon as a
  password was typed.
  A web font has no business in a desktop UI, so they are left out.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*.woff</glob>
      <glob>*.woff2</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
