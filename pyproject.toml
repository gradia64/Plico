[project]
name = "plico"
version = "0.1.2"
description = "Plico — un vero editor PDF nativo per Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    # From 6.12 the PyPI wheels are built against the Python 3.12 headers
    # (PYSIDE-3424) while still declaring 3.10+: on 3.11 every Signal.emit()
    # drops a reference to True, and after a few hundred signals the
    # interpreter aborts with bool_dealloc (PYSIDE-3474). From 3.12 on True is
    # immortal and nothing happens. Held below 6.12 on 3.11 until upstream
    # either fixes the wheels or retags them for 3.12+.
    "PySide6>=6.7,<6.12; python_version < '3.12'",
    "PySide6>=6.7; python_version >= '3.12'",
    # 1.24.3 is the release that renamed the module to `pymupdf`; the code
    # imports that name, and `fitz` survives only as a deprecated alias.
    # Below 2.0: PyMuPDF 2.0 (October 2026) made onnxruntime, numpy, networkx,
    # pymupdf-layout and pymupdf4llm hard dependencies -- about 200 MB that
    # Plico never imports -- and the Flatpak ships 1.28.2, so CI must test that
    # line and not the one pip happens to pick. Moving to 2.x is a decision of
    # its own, made together with flatpak/python3-pymupdf.json.
    "pymupdf>=1.24.3,<2",
    # Compression with a purpose: qpdf through its bindings. `recompress_flate`
    # and `ObjectStreamMode.generate` (the two options that do the work) have
    # existed since pikepdf 9.
    "pikepdf>=9.0",
    # PAdES signatures: building the cryptographic signature and reading it
    # back afterwards are both things one does not write by hand. pyHanko
    # brings cryptography, asn1crypto and lxml with it.
    "pyhanko>=0.37",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
plico = "plico.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ruff 0.17's default rules no longer include E402, and an import left below
# a function went unnoticed (reported by two reviews).
extend-select = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# PySide6 ships partial stubs and PyMuPDF ships none at all (the module is
# imported as `pymupdf`), so missing stubs must not fail the run.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Desktop integration files. Installing them through the packaging metadata
# means one single source of truth: `pip install .` and the Flatpak manifest
# both end up with the launcher, the AppStream metadata and the icon in the
# right place, without duplicating install commands.
# The catalogs a translator edits travel with the package: the compiled `.qm`
# files are made at packaging time (see CONTESTO §11), the `.ts` are the source.
[tool.setuptools.package-data]
plico = ["translations/*.ts", "help/*/index.html"]

[tool.setuptools.data-files]
"share/applications" = ["flatpak/io.github.gradia64.plico.desktop"]
"share/metainfo" = ["flatpak/io.github.gradia64.plico.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["flatpak/io.github.gradia64.plico.svg"]
