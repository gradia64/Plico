[project]
name = "plico"
version = "0.1.0"
description = "Plico — un vero editor PDF nativo per Linux"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "pymupdf>=1.23",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
plico = "plico.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# PySide6 ships partial stubs and PyMuPDF ships none at all (the module is
# imported as `fitz`), so missing stubs must not fail the run.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Desktop integration files. Installing them through the packaging metadata
# means one single source of truth: `pip install .` and the Flatpak manifest
# both end up with the launcher, the AppStream metadata and the icon in the
# right place, without duplicating install commands.
[tool.setuptools.data-files]
"share/applications" = ["flatpak/io.github.gradia.Plico.desktop"]
"share/metainfo" = ["flatpak/io.github.gradia.Plico.metainfo.xml"]
"share/icons/hicolor/scalable/apps" = ["flatpak/io.github.gradia.Plico.svg"]
